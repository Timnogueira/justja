<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Just Já</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="demo-banner">
  <strong>Versão piloto:</strong> ambiente de validação. Assinatura e pagamento ainda são simulados.
</div>

<header class="nav">
  <div class="container nav__inner">
    <a href="index.html" class="nav__brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 2L4 8v9c0 6.6 5.4 12 12 13 6.6-1 12-6.4 12-13V8L16 2z" fill="#0f3d5e"/>
        <path d="M11 16l3.5 3.5L22 12" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      Just Já
    </a>
    <div class="nav__cta">
      <a href="cadastro.html" class="btn btn--ghost">Criar conta</a>
    </div>
  </div>
</header>

<main class="auth">
  <div class="auth__card">
    <h1>Bem-vindo de volta</h1>
    <p class="lead">Entre com seu e-mail e senha para acessar sua conta.</p>

    <form class="form mt-3" id="login-form" novalidate>
      <div class="field">
        <label class="field__label" for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <span class="field__error"></span>
      </div>
      <div class="field">
        <label class="field__label" for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" required>
        <span class="field__error"></span>
      </div>
      <div id="login-error" class="alert alert--danger hide"></div>
      <button type="submit" class="btn btn--primary btn--block btn--lg">Entrar</button>
    </form>

    <div class="auth__footer">
      Ainda não tem conta? <a href="cadastro.html"><strong>Criar agora</strong></a>
    </div>
  </div>
</main>

<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/chat.js"></script>
<script>
  async function redirectByRole() {
    const pessoa = await Pessoas.ensureCurrent();
    if (pessoa && (pessoa.role === "admin" || pessoa.role === "operador")) {
      window.location.href = "admin/index.html";
    } else {
      window.location.href = "app/dashboard.html";
    }
  }

  (async () => {
    // Se já está logado, redireciona por papel
    await Auth.init();
    if (Auth.currentUser()) {
      await redirectByRole();
      return;
    }

    const form = document.getElementById("login-form");
    const errBox = document.getElementById("login-error");
    const submitBtn = form.querySelector("button[type=submit]");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.add("hide");
      const email = document.getElementById("email");
      const senha = document.getElementById("senha");

      App.setFieldError(email, "");
      App.setFieldError(senha, "");

      if (!App.isValidEmail(email.value)) {
        App.setFieldError(email, "Informe um e-mail válido.");
        return;
      }
      if (!senha.value) {
        App.setFieldError(senha, "Informe sua senha.");
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "Entrando…";
      try {
        await Auth.login({ email: email.value, senha: senha.value });
        await redirectByRole();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove("hide");
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";
      }
    });
  })();
</script>

</body>
</html>
