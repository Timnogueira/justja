<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova antecipação — Just Já</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script src="../assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="demo-banner"><strong>Versão demo:</strong> validação interna.</div>

<main class="auth">
  <div class="auth__card" style="text-align:center;">
    <div class="spinner"></div>
    <h2 id="status-titulo">Iniciando nova antecipação…</h2>
    <p class="muted">Te levando para a primeira etapa.</p>
    <div id="error-box" class="alert alert--danger hide mt-2"></div>
  </div>
</main>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
(async () => {
  const user = await Auth.requireAuth("../login.html");
  if (!user) return;

  try {
    const pessoa = await Pessoas.ensureCurrent();
    if (!pessoa) throw new Error("Pessoa não encontrada para esse usuário. Refaça o login.");

    const isAdv = pessoa.role === "advogado";

    // 1) Cria processo vazio (será preenchido na etapa Cadastro)
    const processo = await Processos.create({ tipo: "consumidor" });

    // 2) Cria operação ligada
    const operacao = await Operacoes.create({
      processoId: processo.id,
      tipoSolicitante: isAdv ? "advogado" : "cliente",
      escopo: isAdv ? "so_honorarios" : "integral",
      estagio: "cadastro",
      apelido: "",
    });

    // 3) Redireciona pra jornada
    window.location.href = `jornada.html?id=${operacao.id}&stage=cadastro`;
  } catch (err) {
    console.error(err);
    document.getElementById("status-titulo").textContent = "Não consegui iniciar agora";
    const eb = document.getElementById("error-box");
    eb.classList.remove("hide");
    eb.innerHTML = `
      <div>
        <strong>Erro:</strong> ${err.message || err}<br><br>
        Verifique se as tabelas <code>pessoas</code>, <code>processos</code> e <code>operacoes</code>
        foram criadas no Supabase (rode <code>supabase-schema.sql</code>).
      </div>
    `;
    document.querySelector(".spinner")?.remove();
  }
})();
</script>

</body>
</html>
